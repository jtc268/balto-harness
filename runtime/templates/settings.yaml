agent-default-model:
  provider: sglang
  model: qwen3.8-27b-nvfp4-dspark
  reasoningEffort: off

permission:
  defaultPreset: workspace-write

llm-pi-ai:
  providers:
    sglang:
      displayName: Balto Qwen
      api: openai-completions
      baseURL: http://127.0.0.1:30100/v1
      headers:
        Authorization: Bearer local-balto
      defaultContextWindow: 80000
      defaultMaxTokens: 32768
      defaultInput:
        - text
      retryPolicy:
        mode: normal
        maxRetries: 5
        retryableCodes:
          - EMPTY_RESPONSE
          - RATE_LIMIT
          - SERVER
          - TIMEOUT
          - TRANSPORT
        backoff:
          initialDelayMs: 500
          maxDelayMs: 5000
          jitterRatio: 0.1
      models:
        - id: qwen3.8-27b-nvfp4-dspark
          name: Balto Qwen 3.8 27B
          contextWindow: 80000
          maxTokens: 32768
          input:
            - text
          reasoningEfforts:
            off: none
            high: high
          compat:
            thinkingFormat: deepseek
            supportsReasoningEffort: false
