# Balto starts with one ready local model. Other providers remain available
# through Add Model, but the upstream official route is not preloaded.
- id: llm-deepseek
  disabled: true

# Keep the MVP header focused. Session log exports are not exposed.
- id: session-log-download
  disabled: true

# The web profile disables these coding-agent durability features upstream.
# Balto enables them so long jobs checkpoint, compact, and keep moving.
- id: compaction-basic
  disabled: false
  config:
    modelPolicies:
      - provider: sglang
        model: qwen3.8-27b-nvfp4-dspark
        thresholdRatio: 0.45
        retainTokens: 12000
        maxTokens: 4096
        compactionRetries: 2
        maxOverflowRetries: 3

- id: command-compact
  disabled: false

- id: tool-result-pruner
  disabled: false
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: tool-goal
  disabled: false
  config:
    blockedAfterConsecutiveRounds: 3
